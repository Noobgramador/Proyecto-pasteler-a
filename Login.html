<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Pastelería</title>
    <link rel="stylesheet" href="Estilo.css?v=2">
</head>
<body>

    <header>
        <h1>Mi Pastelería</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html">Iniciar Sesión</a>
        </nav>
    </header>

    <main>
        <section class="tarjeta-login">
            <h2>Iniciar Sesión</h2>
            <p>Accede con tu cuenta de cliente</p>

            <form class="formulario-login">
                <div class="campo">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" placeholder="tu@correo.com" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="******" required>
                </div>

                <button type="submit">Ingresar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Contacto: info@mipasteleria.com</p>
    </footer>

</body>
</html>
