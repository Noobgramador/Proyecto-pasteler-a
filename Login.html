<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mi Pastelería</title>
    <!-- Conexión estricta a CSS en minúsculas -->
    <link rel="stylesheet" href="Estilo.css?v=3">
</head>
<body>

    <!-- ENCABEZADO -->
    <header>
        <h1>Mi Pastelería</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="Login.html">Iniciar Sesión</a>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <section class="tarjeta-login">
            <h2>Iniciar Sesión</h2>
            <p>Accede con tu cuenta de cliente para realizar tus pedidos</p>

            <form class="formulario-login">
                <div class="campo">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="******" required>
                </div>

                <button type="submit">Ingresar</button>
            </form>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Contacto: info@mipasteleria.com | Todos los derechos reservados</p>
    </footer>

    <!-- CONEXIÓN A JAVASCRIPT (OPCIONAL EN LOGIN) -->
    <script src="Script.js"></script>
</body>
</html>
