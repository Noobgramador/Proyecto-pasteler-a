<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasteleria</title>
    <link rel="stylesheet" href="Estilo.css?v=2">
</head>
<body>
    <header>
        <h1>Mi Pastelería</h1>
        <nav>
            <a href="#catalogo">Productos</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Bienvenido a nuestra tienda</h2>
            <p>Postres caseros hechos cada mañana.</p>
        </section>

        <!-- Sección del catálogo de productos -->
        <section id="catalogo">
            <h2>Nuestros Postres</h2>

            <!-- Tarjeta individual de producto -->
            <article>
                <img src="https://www.bing.com/images/search?view=detailV2&ccid=JmKCYTDG&id=A9201802AB20076B0F4805252B64B353113B582E&thid=OIP.JmKCYTDGHMoUqoaZiur08gHaE8&mediaurl=https%3a%2f%2fimag.bonviveur.com%2fpastel-de-chocolate.jpg&cdnurl=https%3a%2f%2fth.bing.com%2fth%2fid%2fR.2662826130c61cca14aa86998aeaf4f2%3frik%3dLlg7EVOzZCslBQ%26pid%3dImgRaw%26r%3d0&exph=800&expw=1200&q=pastel+de+chocolate&FORM=IRPRST&ck=2C09850EEFD866AE2AC56DB834D32CBC&selectedIndex=4&itb=0" alt="Mi foto" class="imagen-personalizada">
                <h3>Pastel de Chocolate</h3>
                <p>Precio: $15</p>
                <button type="button" onclick="agregarAlCarrito('Pastel de Chocolate')">Comprar</button>
            </article>

            <!-- Otra tarjeta de producto -->
            <article>
                <img src="galletas.jpg" alt="Galletas de avena">
                <h3>Galletas de Avena</h3>
                <p>Precio: $5</p>
                <button type="button" onclick="agregarAlCarrito('Galletas de Avena')">Comprar</button>
            </article>

        </section>
    </main>
    <footer>
        <p id="contacto">Contacto: info@mipasteleria.com</p>
    </footer>
    <script src="Script.js"></script>
</body>
</html>
